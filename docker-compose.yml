services:
  portfolio:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - portfolio-data:/data
    environment:
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - TZ=${TZ:-Europe/Amsterdam}
      - PRICE_FETCH_CRON=${PRICE_FETCH_CRON:-0 18 * * 1-5}
    # Public DNS: the Synology host's Pi-hole (192.168.1.202:53) isn't reachable
    # from containers, so price fetching failed with EAI_AGAIN
    dns:
      - 1.1.1.1
      - 9.9.9.9
    restart: unless-stopped

volumes:
  portfolio-data:
