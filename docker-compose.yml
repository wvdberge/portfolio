services:
  portfolio:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - portfolio-data:/data
    environment:
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - TZ=${TZ:-Europe/Amsterdam}
      - PRICE_FETCH_CRON=${PRICE_FETCH_CRON:-0 18 * * 1-5}
    # Pi-hole on the NAS. It must permit all origins (Settings > DNS > Interface
    # settings), otherwise it ignores the Docker network and price fetching
    # fails with EAI_AGAIN
    dns:
      - 192.168.1.202
    restart: unless-stopped

volumes:
  portfolio-data:
